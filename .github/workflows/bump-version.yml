name: Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Commit and push selected branch source only
        env:
          BUMP_MODE: ${{ inputs.mode }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .github/scripts/bump.py \
            --mode "$BUMP_MODE" --sha "$GITHUB_SHA" --ref "$GITHUB_REF"
