# Build the native macOS slice in the existing cross-platform bundle.
# Windows prebuilts and bundle resources are preserved, not rebuilt.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Running Application
  XCODE_PROJECT: Running Application.xcodeproj
  MACOS_DEPLOYMENT_TARGET: '11.0'

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS, package, sign, notarize & release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: preflight
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: remove generated macOS outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          root = Path(os.environ["GITHUB_WORKSPACE"])
          product = os.environ["PRODUCT_NAME"]
          selected = []

          def select_generated(parent, parts, directory=False):
              if parent.is_symlink():
                  raise RuntimeError(f"Refusing symlink directory: {parent}")
              if not parent.exists():
                  return
              for path in parent.iterdir():
                  if path.name.casefold() != parts[0].casefold():
                      continue
                  if len(parts) > 1:
                      select_generated(path, parts[1:], directory)
                  else:
                      selected.append((path, directory))

          # Validate every ancestor before deleting anything, including stale Default outputs.
          for prefix in (
              ("test", "Plugins", product + ".bundle"),
              ("test", "Plugins", "Default", product + ".bundle"),
          ):
              for parts in (
                  ("Contents", "MacOS", product),
                  ("Contents", "Info.plist"),
                  ("Contents", "Resources", "English.lproj", "InfoPlist.strings"),
              ):
                  select_generated(root, prefix + parts)
              select_generated(root, prefix + ("Contents", "_CodeSignature"), directory=True)
          select_generated(root, (
              "build", product + ".build", "Default", product + ".build",
          ), directory=True)
          for path, directory in selected:
              if directory and not path.is_symlink():
                  shutil.rmtree(path)
              else:
                  path.unlink()
          PY

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$PRODUCT_NAME" \
            -configuration Default \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/test/Plugins" \
            OBJROOT="$GITHUB_WORKSPACE/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BUNDLE_PATH="test/Plugins/${PRODUCT_NAME}.bundle"
          BIN="$BUNDLE_PATH/Contents/MacOS/$PRODUCT_NAME"
          ARCHITECTURES=$(lipo -archs "$BIN")
          for REQUIRED_ARCH in arm64 x86_64; do
            FOUND=false
            for ARCH in $ARCHITECTURES; do
              if [ "$ARCH" = "$REQUIRED_ARCH" ]; then FOUND=true; fi
            done
            if [ "$FOUND" != true ]; then
              echo "Missing architecture: $REQUIRED_ARCH" >&2
              exit 1
            fi
          done
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          test -n "$IDENTITY"
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_PATH="${PRODUCT_NAME}-${VERSION}.zip"
          DMG_PATH="${PRODUCT_NAME}-${VERSION}.dmg"

          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT_NAME" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          for ARTIFACT in "$ZIP_PATH" "$DMG_PATH"; do
            xcrun notarytool submit "$ARTIFACT" \
              --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" \
              --wait --output-format json \
              | python3 -c 'import json, sys; result = json.load(sys.stdin); sys.exit(0 if result.get("status") == "Accepted" else 1)'
          done
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" --zip "$ZIP_PATH" --dmg "$DMG_PATH"
